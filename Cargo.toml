# Carte, the structure framework (docs/APPLICATION.md §1 records the name).
# Not published yet.
[package]
name = "carte"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Carte: the route table, the walk, the outbox, and schema reflection"
license = "MIT"
publish = false

# Empty on purpose, and load-bearing: APPLICATION.md §2's guarantee is that
# Carte depends on nothing of the surface framework, and
# `cargo tree -p carte` showing nothing at all is the proof.
[dependencies]

# Examples only. The library ships with nothing (tests/independence.rs).
[dev-dependencies]
eframe = "0.31.1"
